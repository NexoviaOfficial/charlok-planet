<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>الدردشة | كوكب الشارلوكيين</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0b1a; --panel:#15132a; --purple:#8a2be2; --cyan:#00e5ff; --pink:#ff2d95;
    --text:#e8e6f5; --muted:#8b87a8; --danger:#ff4d6d; --line: rgba(138,43,226,.3);
    --bubble-own: linear-gradient(135deg, rgba(138,43,226,.35), rgba(255,45,149,.25));
    --bubble-other:#1c1a33;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{ height:100%; overscroll-behavior-y:none; }
  body{
    background:var(--bg); color:var(--text); font-family:'Tajawal',sans-serif;
    display:flex; flex-direction:column;
    background-image:
      radial-gradient(circle at 10% 0%, rgba(138,43,226,.18), transparent 40%),
      radial-gradient(circle at 90% 100%, rgba(0,229,255,.12), transparent 40%);
  }

  header{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:12px 16px; border-bottom:1px solid var(--line); background:rgba(13,11,26,.92);
    position:sticky; top:0; z-index:20; backdrop-filter:blur(6px);
  }
  .hleft{ display:flex; align-items:center; gap:10px; min-width:0; }
  #backBtn{
    background:transparent; border:1px solid var(--line); color:var(--text); width:36px; height:36px;
    border-radius:10px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none;
  }
  #backBtn:hover{ border-color:var(--cyan); }
  .brand-logo{
    width:36px; height:36px; border-radius:10px; background:linear-gradient(135deg, var(--purple), var(--pink));
    display:flex; align-items:center; justify-content:center; font-size:16px; flex:none;
  }
  .htitle{ min-width:0; }
  .htitle b{ display:block; font-size:14.5px; color:#fff; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .htitle span{ font-size:11.5px; color:var(--muted); }
  .online-dot{ width:7px; height:7px; border-radius:50%; background:#3ddc84; display:inline-block; margin-inline-end:4px; box-shadow:0 0 6px #3ddc84; }

  #messages{
    flex:1; overflow-y:auto; padding:16px 12px 10px; display:flex; flex-direction:column; gap:10px;
    scroll-behavior:smooth;
  }
  .day-sep{ align-self:center; font-size:11px; color:var(--muted); background:var(--panel); border:1px solid var(--line);
    padding:4px 12px; border-radius:20px; margin:6px 0; }

  .row{ display:flex; width:100%; }
  .row.own{ justify-content:flex-start; }
  .row.other{ justify-content:flex-end; }

  .bubble-wrap{ max-width:78%; display:flex; flex-direction:column; gap:3px; position:relative; }
  .row.own .bubble-wrap{ align-items:flex-start; }
  .row.other .bubble-wrap{ align-items:flex-end; }

  .sender{ font-size:11.5px; font-weight:700; padding:0 4px; color:var(--cyan); }
  .row.own .sender{ color:var(--pink); }

  .bubble{
    padding:10px 13px; border-radius:16px; font-size:14.5px; line-height:1.6; word-break:break-word;
    white-space:pre-wrap; position:relative; user-select:none; -webkit-user-select:none;
    transition:filter .15s;
  }
  .row.own .bubble{ background:var(--bubble-own); border:1px solid rgba(138,43,226,.45); border-bottom-left-radius:5px; }
  .row.other .bubble{ background:var(--bubble-other); border:1px solid var(--line); border-bottom-right-radius:5px; }
  .bubble.pressed{ filter:brightness(1.25); }
  .bubble a{ color:var(--cyan); text-decoration:underline; word-break:break-all; }

  .meta-line{ display:flex; align-items:center; gap:5px; font-size:10.5px; color:var(--muted); padding:0 4px; }
  .meta-line .edited{ font-style:normal; opacity:.8; }

  .reactions-bar{ display:flex; flex-wrap:wrap; gap:4px; padding:0 4px; }
  .reaction-pill{
    display:flex; align-items:center; gap:4px; background:var(--panel); border:1px solid var(--line);
    border-radius:20px; padding:2px 8px; font-size:12px; cursor:pointer; transition:.15s;
  }
  .reaction-pill.mine{ border-color:var(--cyan); background:rgba(0,229,255,.1); }
  .reaction-pill:active{ transform:scale(.94); }

  #ctxOverlay{
    position:fixed; inset:0; background:rgba(5,4,12,.55); z-index:60; display:none;
    align-items:flex-end; justify-content:center;
  }
  #ctxOverlay.show{ display:flex; }
  #ctxSheet{
    width:100%; max-width:420px; background:var(--panel); border:1px solid var(--line); border-bottom:none;
    border-radius:18px 18px 0 0; padding:14px 14px 22px; animation:slideUp .18s ease-out;
  }
  @keyframes slideUp{ from{ transform:translateY(100%); } to{ transform:translateY(0); } }
  #ctxPreview{
    background:#0d0b1a; border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:12px;
    font-size:13px; color:var(--muted); max-height:60px; overflow:hidden; text-overflow:ellipsis;
  }
  .react-row{ display:flex; justify-content:space-between; padding:6px 4px 14px; }
  .react-emoji{
    font-size:23px; background:none; border:none; cursor:pointer; padding:6px; border-radius:50%; transition:.15s;
    line-height:1;
  }
  .react-emoji:active{ transform:scale(1.25); background:rgba(255,255,255,.06); }

  .ctx-item{
    display:flex; align-items:center; gap:12px; padding:13px 10px; border-radius:12px; cursor:pointer;
    font-size:14.5px; font-weight:600; color:var(--text); background:none; border:none; width:100%; text-align:right;
    font-family:'Tajawal';
  }
  .ctx-item:active{ background:rgba(255,255,255,.05); }
  .ctx-item .ic{ width:20px; height:20px; flex:none; display:flex; align-items:center; justify-content:center; color:var(--muted); }
  .ctx-item.danger{ color:var(--danger); }
  .ctx-item.danger .ic{ color:var(--danger); }
  .ctx-divider{ height:1px; background:var(--line); margin:4px 0; }
  .ctx-cancel{ margin-top:6px; text-align:center; color:var(--muted); font-weight:700; padding:12px; cursor:pointer; }

  #editBanner{
    display:none; align-items:center; justify-content:space-between; gap:10px; padding:8px 14px;
    background:rgba(138,43,226,.12); border-top:1px solid var(--line); font-size:12.5px; color:var(--cyan);
  }
  #editBanner.show{ display:flex; }
  #editBanner button{ background:none; border:none; color:var(--muted); font-size:13px; cursor:pointer; font-family:'Tajawal'; }

  #composer{
    display:flex; align-items:flex-end; gap:10px; padding:10px 12px; border-top:1px solid var(--line);
    background:rgba(13,11,26,.95); position:sticky; bottom:0;
  }
  #msgInput{
    flex:1; resize:none; max-height:110px; min-height:44px; background:var(--panel); border:1px solid var(--line);
    border-radius:14px; color:var(--text); font-family:'Tajawal'; font-size:14.5px; padding:11px 14px; line-height:1.5;
  }
  #msgInput:focus{ outline:none; border-color:var(--cyan); }
  #sendBtn{
    width:44px; height:44px; border-radius:50%; border:none; flex:none; cursor:pointer;
    background:linear-gradient(135deg, var(--purple), var(--pink)); display:flex; align-items:center; justify-content:center;
    transition:.15s;
  }
  #sendBtn:disabled{ opacity:.4; cursor:not-allowed; }
  #sendBtn:active{ transform:scale(.92); }

  #emptyState{ margin:auto; text-align:center; color:var(--muted); font-size:13px; padding:30px; }

  #loadingGate{
    position:fixed; inset:0; background:var(--bg); display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:14px; color:var(--muted); z-index:99;
  }
  .loader-ring{ width:38px; height:38px; border-radius:50%; border:3px solid rgba(138,43,226,.25); border-top-color:var(--cyan); animation:spin .8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #appContent{ display:none; height:100vh; flex-direction:column; }
  #appContent.ready{ display:flex; }
</style>
</head>
<body>

<div id="loadingGate">
  <div class="loader-ring"></div>
  <div>جاري التحقق من الدخول...</div>
</div>

<div id="appContent">
  <header>
    <div class="hleft">
      <button id="backBtn" aria-label="رجوع" title="رجوع">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <div class="brand-logo">🕵️</div>
      <div class="htitle">
        <b>غرفة الدردشة</b>
        <span><span class="online-dot"></span>عصابة الشارلوكيين</span>
      </div>
    </div>
  </header>

  <div id="messages">
    <div id="emptyState">لا توجد رسائل بعد، كن أول من يكتب 👋</div>
  </div>

  <div id="editBanner">
    <span>تعديل الرسالة</span>
    <button id="cancelEditBtn">إلغاء</button>
  </div>

  <div id="composer">
    <textarea id="msgInput" placeholder="اكتب رسالتك..." rows="1" maxlength="2000"></textarea>
    <button id="sendBtn" aria-label="إرسال">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
    </button>
  </div>
</div>

<div id="ctxOverlay">
  <div id="ctxSheet">
    <div id="ctxPreview"></div>
    <div class="react-row" id="reactRow"></div>
    <div class="ctx-divider"></div>
    <button class="ctx-item" id="ctxCopy">
      <span class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></span>
      نسخ النص
    </button>
    <button class="ctx-item" id="ctxEdit">
      <span class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></span>
      تعديل الرسالة
    </button>
    <button class="ctx-item danger" id="ctxDelete">
      <span class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg></span>
      حذف الرسالة
    </button>
    <div class="ctx-cancel" id="ctxCancel">إلغاء</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  (function(){
    "use strict";

    const loadingGate = document.getElementById('loadingGate');
    const appContent  = document.getElementById('appContent');
    const messagesEl  = document.getElementById('messages');
    const emptyState  = document.getElementById('emptyState');
    const msgInput    = document.getElementById('msgInput');
    const sendBtn     = document.getElementById('sendBtn');
    const editBanner  = document.getElementById('editBanner');
    const cancelEditBtn = document.getElementById('cancelEditBtn');
    const backBtn     = document.getElementById('backBtn');

    const ctxOverlay  = document.getElementById('ctxOverlay');
    const ctxPreview  = document.getElementById('ctxPreview');
    const reactRow    = document.getElementById('reactRow');
    const ctxCopy     = document.getElementById('ctxCopy');
    const ctxEdit     = document.getElementById('ctxEdit');
    const ctxDelete   = document.getElementById('ctxDelete');
    const ctxCancel   = document.getElementById('ctxCancel');

    const QUICK_REACTIONS = ['👍','❤️','😂','😮','😢','🙏'];
    const LONG_PRESS_MS = 420;
    const MAX_MESSAGES = 300;

    let currentUser = null;
    let editingId = null;
    let activeMsgId = null;
    let activeMsgData = null;
    let unsubscribe = null;
    const renderedIds = new Set();

    backBtn.onclick = () => { window.location.href = 'home.html'; };

    // ===== مراقبة تسجيل الدخول الفوري =====
    auth.onAuthStateChanged(user => {
      if(user){
        currentUser = user;
        loadingGate.style.display = 'none';
        appContent.classList.add('ready');
        listenMessages();
      }else{
        window.location.replace('index.html');
      }
    });

    function escapeHtml(str){
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    const URL_RE = /(https?:\/\/[^\s<]+)/g;
    function linkify(escapedText){
      return escapedText.replace(URL_RE, url => {
        const clean = url.replace(/[.,)!?]+$/, '');
        const trail = url.slice(clean.length);
        return `<a href="${clean}" target="_blank" rel="noopener noreferrer nofollow">${clean}</a>${trail}`;
      });
    }

    function renderText(raw){
      return linkify(escapeHtml(raw));
    }

    function formatTime(ts){
      if(!ts || !ts.toDate) return '';
      const d = ts.toDate();
      return d.toLocaleTimeString('ar', { hour:'2-digit', minute:'2-digit' });
    }

    function scrollToBottom(){
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function listenMessages(){
      if(unsubscribe) unsubscribe();
      unsubscribe = db.collection('messages')
        .orderBy('createdAt', 'asc')
        .limitToLast(MAX_MESSAGES)
        .onSnapshot(snapshot => {
          const wasAtBottom = messagesEl.scrollTop + messagesEl.clientHeight >= messagesEl.scrollHeight - 60;
          snapshot.docChanges().forEach(change => {
            if(change.type === 'added')   upsertMessage(change.doc);
            if(change.type === 'modified') upsertMessage(change.doc);
            if(change.type === 'removed') removeMessage(change.doc.id);
          });
          emptyState.style.display = snapshot.empty ? 'block' : 'none';
          if(wasAtBottom) scrollToBottom();
        }, err => {
          console.error('فشل تحميل الرسائل:', err);
        });
    }

    function upsertMessage(doc){
      const data = doc.data();
      const id = doc.id;
      let row = document.getElementById('row-' + id);
      const isOwn = currentUser && data.uid === currentUser.uid;

      const html = buildBubbleHtml(id, data, isOwn);

      if(row){
        row.outerHTML = html;
      } else {
        messagesEl.insertAdjacentHTML('beforeend', html);
        renderedIds.add(id);
      }
      attachRowHandlers(id, data);
    }

    function removeMessage(id){
      const row = document.getElementById('row-' + id);
      if(row) row.remove();
      renderedIds.delete(id);
    }

    function buildBubbleHtml(id, data, isOwn){
      const name = escapeHtml(data.name || 'عضو');
      const text = renderText(data.text || '');
      const time = formatTime(data.createdAt);
      const editedLabel = data.edited ? '<span class="edited">· معدّلة</span>' : '';
      const reactionsHtml = buildReactionsHtml(data.reactions);

      return `
        <div class="row ${isOwn ? 'own' : 'other'}" id="row-${id}" data-id="${id}">
          <div class="bubble-wrap">
            ${isOwn ? '' : `<div class="sender">${name}</div>`}
            <div class="bubble" id="bubble-${id}">${text}</div>
            <div class="meta-line"><span>${time}</span>${editedLabel}</div>
            ${reactionsHtml}
          </div>
        </div>`;
    }

    function buildReactionsHtml(reactions){
      if(!reactions) return '';
      const uid = currentUser ? currentUser.uid : null;
      const pills = Object.keys(reactions)
        .filter(emoji => Array.isArray(reactions[emoji]) && reactions[emoji].length > 0)
        .map(emoji => {
          const users = reactions[emoji];
          const mine = uid && users.includes(uid) ? 'mine' : '';
          return `<div class="reaction-pill ${mine}" data-emoji="${emoji}">${emoji} <span>${users.length}</span></div>`;
        }).join('');
      return pills ? `<div class="reactions-bar">${pills}</div>` : '';
    }

    function attachRowHandlers(id, data){
      const bubble = document.getElementById('bubble-' + id);
      if(!bubble) return;

      let pressTimer = null;
      const startPress = () => {
        pressTimer = setTimeout(() => {
          bubble.classList.add('pressed');
          if(navigator.vibrate) navigator.vibrate(12);
          openContextMenu(id, data);
        }, LONG_PRESS_MS);
      };
      const cancelPress = () => {
        clearTimeout(pressTimer);
        bubble.classList.remove('pressed');
      };

      bubble.addEventListener('touchstart', startPress, { passive:true });
      bubble.addEventListener('touchend', cancelPress);
      bubble.addEventListener('touchmove', cancelPress);
      bubble.addEventListener('mousedown', startPress);
      bubble.addEventListener('mouseup', cancelPress);
      bubble.addEventListener('mouseleave', cancelPress);
      bubble.addEventListener('contextmenu', e => { e.preventDefault(); openContextMenu(id, data); });

      const wrap = bubble.closest('.bubble-wrap');
      if(wrap){
        wrap.querySelectorAll('.reaction-pill').forEach(pill => {
          pill.onclick = () => toggleReaction(id, pill.dataset.emoji);
        });
      }
    }

    function openContextMenu(id, data){
      activeMsgId = id;
      activeMsgData = data;
      const isOwn = currentUser && data.uid === currentUser.uid;

      ctxPreview.textContent = (data.text || '').slice(0, 140);
      ctxEdit.style.display = isOwn ? 'flex' : 'none';
      ctxDelete.style.display = isOwn ? 'flex' : 'none';

      reactRow.innerHTML = QUICK_REACTIONS.map(e =>
        `<button class="react-emoji" data-emoji="${e}">${e}</button>`).join('');
      reactRow.querySelectorAll('.react-emoji').forEach(btn => {
        btn.onclick = () => { toggleReaction(id, btn.dataset.emoji); closeContextMenu(); };
      });

      ctxOverlay.classList.add('show');
    }

    function closeContextMenu(){
      ctxOverlay.classList.remove('show');
      document.querySelectorAll('.bubble.pressed').forEach(b => b.classList.remove('pressed'));
      activeMsgId = null;
      activeMsgData = null;
    }

    ctxOverlay.addEventListener('click', e => { if(e.target === ctxOverlay) closeContextMenu(); });
    ctxCancel.onclick = closeContextMenu;

    ctxCopy.onclick = async () => {
      if(activeMsgData){
        try{ await navigator.clipboard.writeText(activeMsgData.text || ''); }catch(e){}
      }
      closeContextMenu();
    };

    ctxEdit.onclick = () => {
      if(!activeMsgId || !activeMsgData) return;
      editingId = activeMsgId;
      msgInput.value = activeMsgData.text || '';
      msgInput.focus();
      editBanner.classList.add('show');
      autoGrow();
      closeContextMenu();
    };

    ctxDelete.onclick = async () => {
      if(!activeMsgId) return;
      const id = activeMsgId;
      closeContextMenu();
      try{
        await db.collection('messages').doc(id).delete();
      }catch(err){
        console.error('تعذر حذف الرسالة:', err);
      }
    };

    cancelEditBtn.onclick = () => {
      editingId = null;
      msgInput.value = '';
      editBanner.classList.remove('show');
      autoGrow();
    };

    async function toggleReaction(id, emoji){
      if(!currentUser) return;
      const ref = db.collection('messages').doc(id);
      try{
        await db.runTransaction(async t => {
          const snap = await t.get(ref);
          if(!snap.exists) return;
          const data = snap.data();
          const reactions = data.reactions || {};
          const users = reactions[emoji] || [];
          const uid = currentUser.uid;
          const has = users.includes(uid);
          const updated = has ? users.filter(u => u !== uid) : [...users, uid];
          t.update(ref, { [`reactions.${emoji}`]: updated });
        });
      }catch(err){
        console.error('تعذر تحديث التفاعل:', err);
      }
    }

    function autoGrow(){
      msgInput.style.height = 'auto';
      msgInput.style.height = Math.min(msgInput.scrollHeight, 110) + 'px';
      sendBtn.disabled = msgInput.value.trim().length === 0;
    }
    msgInput.addEventListener('input', autoGrow);
    msgInput.addEventListener('keydown', e => {
      if(e.key === 'Enter' && !e.shiftKey){
        e.preventDefault();
        submitMessage();
      }
    });
    sendBtn.onclick = submitMessage;
    autoGrow();

    async function submitMessage(){
      const text = msgInput.value.trim();
      if(!text || !currentUser) return;
      sendBtn.disabled = true;

      try{
        if(editingId){
          await db.collection('messages').doc(editingId).update({
            text: text,
            edited: true,
            editedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          editingId = null;
          editBanner.classList.remove('show');
        } else {
          await db.collection('messages').add({
            text: text,
            uid: currentUser.uid,
            name: currentUser.displayName || 'عضو',
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            edited: false,
            reactions: {}
          });
        }
        msgInput.value = '';
        autoGrow();
        scrollToBottom();
      }catch(err){
        console.error('تعذر إرسال الرسالة:', err);
      }finally{
        sendBtn.disabled = msgInput.value.trim().length === 0;
      }
    }

    window.addEventListener('pageshow', function(event){
      if(event.persisted){ window.location.reload(); }
    });

    window.addEventListener('beforeunload', () => { if(unsubscribe) unsubscribe(); });
  })();
</script>
</body>
</html>
